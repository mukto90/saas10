name: Deploy to Production

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This loads your private key into ssh-agent
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CXD_PRIVATE_KEY }}

      # Optional: Add server to known_hosts to avoid host key verification issues
      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.CXD_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy with rsync
        run: |
          rsync -avz --progress \
            --exclude='requirements' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='LLM.md' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ \
            root@${{ secrets.CXD_SERVER_IP }}:/var/www/html/saas10.xyz/